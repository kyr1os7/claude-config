scanner:
  # Grok hanya melihat jendela waktu ini. Terlalu lebar = meme sudah basi.
  window_hours: 12
  # Berapa kali scan per jam. Velocity butuh >=2 observasi, jadi jangan terlalu jarang.
  interval_minutes: 20
  model: grok-4
  max_candidates: 12

filters:
  # Buang kandidat yang CT-nya sudah ramai. Ini gerbang utama strategi.
  max_crypto_saturation: 35
  # Heat minimum di timeline normie.
  min_heat: 45
  # Butuh minimal sekian komunitas berbeda supaya bukan sekadar 1 klaster.
  min_communities: 2

discovery:
  # Dexscreener search: chain-agnostic, tanpa API key.
  chains: [solana, ethereum, base]
  max_pair_age_hours: 24
  min_liquidity_usd: 8000
  max_fdv_usd: 3000000

scoring:
  alert_threshold: 60

safety:
  # Fail-closed: kalau cek gagal, token dianggap tidak aman.
  require_authorities_revoked: true   # mint & freeze authority wajib sudah dilepas
  min_lp_locked_pct: 80
  max_top_holder_pct: 15
  max_top10_pct: 40

paper:
  enabled: true
  size_sol: 0.5            # ukuran posisi hipotetis
  take_profit_x: 5.0
  stop_loss_pct: 50
  max_hold_minutes: 180
  slippage_pct: 3          # dikenakan pada sisi masuk DAN keluar
  fee_sol: 0.003           # gas + priority fee per sisi
  # Cek harga posisi terbuka lebih sering daripada scan sosial.
  track_interval_minutes: 5

store:
  path: ./sniper.db
